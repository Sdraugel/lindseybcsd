<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Events - Lindsey Draugel for School Board, District 2</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Upcoming campaign events for Lindsey Draugel, candidate for Berkeley County School District Board, District 2."
    />
    <meta name="theme-color" content="#2748C8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Cabin+Sketch:wght@700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbfaf3;
        --paper-soft: #fffefa;
        --blue: #2748c8;
        --blue-soft: #3a5be0;
        --rasp: #b05878;
        --rasp-ink: #8c4060;
        --ink: #2c2e35;
        --ink-soft: #565a63;
        --rule: rgba(122, 167, 214, 0.34);
        --margin: rgba(214, 104, 90, 0.5);
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          linear-gradient(to right, transparent 28px, var(--margin) 28px, var(--margin) 30px, transparent 30px),
          repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
        background-repeat: no-repeat, repeat;
      }
      @media (min-width: 768px) {
        body {
          background-image:
            linear-gradient(to right, transparent 70px, var(--margin) 70px, var(--margin) 72px, transparent 72px),
            repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
        }
      }
      .shell {
        width: 100%;
        max-width: 60rem;
        margin-inline: auto;
        padding-inline: clamp(1.5rem, 5vw, 3.5rem);
        padding-left: max(clamp(1.5rem, 5vw, 3.5rem), 5rem);
      }
      a { color: var(--blue); }
      header { padding-top: 1.75rem; }
      .wordmark { display: inline-flex; align-items: baseline; gap: 0.5rem; text-decoration: none; }
      .wordmark .name { font-family: "Cabin Sketch", cursive; font-weight: 700; color: var(--blue); font-size: 1.9rem; line-height: 1; }
      .wordmark .tag { font-family: "Baloo 2", sans-serif; font-weight: 700; color: var(--rasp-ink); font-size: 0.95rem; }
      main { padding-top: 1.5rem; padding-bottom: 3rem; }
      .eyebrow {
        font-family: "Baloo 2", sans-serif; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; font-size: 0.8rem; color: var(--rasp-ink); margin: 0;
      }
      h1 {
        font-family: "Cabin Sketch", cursive; font-weight: 700; color: var(--blue);
        font-size: clamp(2.75rem, 8vw, 4.5rem); line-height: 1; margin: 0.25rem 0 0;
        text-shadow: 0 0.04em 0.05em rgba(24, 42, 110, 0.18);
      }
      .intro { font-size: 1.125rem; max-width: 40rem; margin: 1rem 0 0; }
      .card {
        background: var(--paper-soft);
        border: 1px solid rgba(44, 46, 53, 0.1);
        border-radius: 14px;
        box-shadow: 0 10px 30px -18px rgba(24, 42, 110, 0.35);
        padding: 0.75rem;
        margin-top: 2rem;
        overflow: hidden;
      }
      .card iframe { display: block; border: 0; width: 100%; height: 640px; border-radius: 10px; }
      @media (max-width: 640px) { .card iframe { height: 560px; } }
      .coming { padding: 3rem 1.5rem; text-align: center; }
      .coming .big { font-family: "Cabin Sketch", cursive; font-weight: 700; color: var(--blue); font-size: 2rem; }
      .coming p { color: var(--ink-soft); max-width: 30rem; margin: 0.75rem auto 0; }
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
        font-family: "Baloo 2", sans-serif; font-weight: 700; border-radius: 999px;
        padding: 0.6rem 1.2rem; font-size: 1rem;
      }
      .btn-primary { background: var(--blue); color: #fff; }
      .btn-ghost { color: var(--blue); border: 2px solid var(--blue); background: transparent; }
      .actions { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      .mailto { font-family: "Baloo 2", sans-serif; font-weight: 700; }
      footer { border-top: 1px solid rgba(0, 0, 0, 0.1); font-size: 0.875rem; color: var(--ink-soft); }
      footer .row { padding-block: 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; }
      :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <a class="wordmark" href="./" aria-label="Draugel for District 2, back to home">
          <span class="name">Draugel</span>
          <span class="tag">District 2</span>
        </a>
      </div>
    </header>

    <main>
      <div class="shell">
        <p class="eyebrow">On the calendar</p>
        <h1>Upcoming Events</h1>
        <p class="intro">
          Come say hello. Town halls, meet-and-greets, and community events are
          posted here as they're scheduled.
        </p>

        <div class="card">
          <div id="cal-mount"></div>
        </div>

        <div class="actions" id="subscribe-wrap" style="display: none">
          <a class="btn btn-primary" id="subscribe" href="#" target="_blank" rel="noopener noreferrer">
            Follow on Google Calendar
          </a>
          <a class="btn btn-ghost" href="./">&larr; Back to home</a>
        </div>
        <div class="actions" id="home-only">
          <a class="btn btn-ghost" href="./">&larr; Back to home</a>
        </div>
      </div>
    </main>

    <footer>
      <div class="shell">
        <div class="row">
          <span><strong style="color: var(--blue); font-family: 'Cabin Sketch', cursive">Draugel</strong> for District 2</span>
          <a class="mailto" href="mailto:draugelfordistrict2@gmail.com">draugelfordistrict2&#64;gmail.com</a>
          <span id="year-line"></span>
        </div>
      </div>
    </footer>

    <script>
      /*
        TODO(calendar): paste the campaign Google Calendar ID below, then make
        that calendar PUBLIC (Google Calendar > Settings > [calendar] > Access
        permissions > "Make available to public" = See all event details).

        The primary calendar ID for the campaign Gmail is just the address:
          const CALENDAR_ID = 'draugelfordistrict2@gmail.com';
        A secondary calendar's ID looks like:
          'abc123...@group.calendar.google.com'  (Settings > Integrate calendar > Calendar ID)

        Leave it '' and the page shows a friendly "coming soon" state.
        The embed is READ-ONLY: visitors can only view; only signed-in editors
        (you) can change events, and only inside Google Calendar.
      */
      var CALENDAR_ID = 'e208260556cd9dfab5cda9336df9950f0fc972a2815eef0ef71cd87f54bcb3d7@group.calendar.google.com';

      var mount = document.getElementById('cal-mount');
      if (CALENDAR_ID) {
        var src =
          'https://calendar.google.com/calendar/embed?src=' +
          encodeURIComponent(CALENDAR_ID) +
          '&ctz=America%2FNew_York&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23FBFAF3';
        var iframe = document.createElement('iframe');
        iframe.title = 'Lindsey Draugel campaign events';
        iframe.src = src;
        iframe.loading = 'lazy';
        mount.appendChild(iframe);

        document.getElementById('subscribe').href =
          'https://calendar.google.com/calendar/u/0/r?cid=' + encodeURIComponent(CALENDAR_ID);
        document.getElementById('subscribe-wrap').style.display = '';
        document.getElementById('home-only').style.display = 'none';
      } else {
        mount.innerHTML =
          '<div class="coming">' +
          '<div class="big">Events are coming soon</div>' +
          '<p>We are lining up town halls and community events. Check back shortly, ' +
          'or email <a href="mailto:draugelfordistrict2@gmail.com">draugelfordistrict2@gmail.com</a> ' +
          'to get notified.</p>' +
          '</div>';
      }

      document.getElementById('year-line').textContent =
        '© ' + new Date().getFullYear() + ' Lindsey Draugel for District 2.';
    </script>
  </body>
</html>
