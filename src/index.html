<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draugel for School Board · District 2</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Draugel for Berkeley County School District Board, District 2. A parent, early-childhood educator, and community advocate fighting for our students and teachers."
    />
    <meta name="theme-color" content="#2748C8" />
    <meta name="color-scheme" content="light" />

    <!-- Social sharing (Open Graph / Twitter). TODO(asset): host a 1200x630 share image and set the URL below. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sdraugel.github.io/lindseybcsd/" />
    <meta property="og:title" content="Draugel for School Board · District 2" />
    <meta
      property="og:description"
      content="For our students. For our teachers. Draugel for BCSD Board, District 2."
    />
    <!-- Absolute URL for the live GitHub Pages site. Update if you move to a custom domain. -->
    <meta property="og:image" content="https://sdraugel.github.io/lindseybcsd/img/lindsey-headshot.jpg" />
    <meta property="og:image:alt" content="Lindsey Draugel" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts: "Baloo 2" = rounded bubble/marker display; "Nunito" = friendly body sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Flag JS availability BEFORE first paint. The scroll-reveal CSS only hides
      pre-animation content under `.js`, so with JS disabled (or if a script fails)
      the page renders fully visible and legible - good for accessibility + SEO.
    -->
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
